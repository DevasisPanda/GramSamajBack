services:
  - type: web
    name: ngo-management-system
    env: node
    region: singapore
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,https://airdup.com,https://www.airdup.com,http://localhost:5173,http://127.0.0.1:5173"
      - key: FRONTEND_URL
        sync: false

